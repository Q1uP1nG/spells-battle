services:
  spells-server:
    build: .
    restart: unless-stopped
    environment:
      SPELLS_SERVER_HOST: 0.0.0.0
      SPELLS_SERVER_PORT: 8765
      SPELLS_SERVER_TICK_RATE: ${SPELLS_SERVER_TICK_RATE:-30}
      SPELLS_SERVER_SNAPSHOT_RATE: ${SPELLS_SERVER_SNAPSHOT_RATE:-15}
      SPELLS_SERVER_RECONNECT_TIMEOUT: ${SPELLS_SERVER_RECONNECT_TIMEOUT:-45}
      SPELLS_SERVER_ROOM_IDLE_TIMEOUT: ${SPELLS_SERVER_ROOM_IDLE_TIMEOUT:-900}
      SPELLS_SERVER_LOG_LEVEL: ${SPELLS_SERVER_LOG_LEVEL:-INFO}
      SPELLS_SERVER_MAX_ROOMS: ${SPELLS_SERVER_MAX_ROOMS:-1000}
      SPELLS_SERVER_CLIENT_SEND_QUEUE: ${SPELLS_SERVER_CLIENT_SEND_QUEUE:-64}
    expose:
      - "8765"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      spells-server:
        condition: service_healthy
    environment:
      SPELLS_DOMAIN: ${SPELLS_DOMAIN}
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
