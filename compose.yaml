services:
  spells-server:
    build: .
    restart: unless-stopped
    environment:
      SPELLS_SERVER_HOST: 0.0.0.0
      SPELLS_SERVER_PORT: 8765
      SPELLS_SERVER_TICK_RATE: ${SPELLS_SERVER_TICK_RATE:-30}
      SPELLS_SERVER_SNAPSHOT_RATE: ${SPELLS_SERVER_SNAPSHOT_RATE:-15}
      SPELLS_SERVER_RECONNECT_TIMEOUT: ${SPELLS_SERVER_RECONNECT_TIMEOUT:-45}
      SPELLS_SERVER_ROOM_IDLE_TIMEOUT: ${SPELLS_SERVER_ROOM_IDLE_TIMEOUT:-900}
      SPELLS_SERVER_LOG_LEVEL: ${SPELLS_SERVER_LOG_LEVEL:-INFO}
      SPELLS_SERVER_MAX_ROOMS: ${SPELLS_SERVER_MAX_ROOMS:-1000}
      SPELLS_SERVER_CLIENT_SEND_QUEUE: ${SPELLS_SERVER_CLIENT_SEND_QUEUE:-256}
      SPELLS_SERVER_CLIENT_SEND_TIMEOUT: ${SPELLS_SERVER_CLIENT_SEND_TIMEOUT:-5}
      SPELLS_SERVER_CLIENT_RELIABLE_BURST: ${SPELLS_SERVER_CLIENT_RELIABLE_BURST:-8}
      SPELLS_SERVER_MAX_CONNECTIONS: ${SPELLS_SERVER_MAX_CONNECTIONS:-2000}
      SPELLS_SERVER_MAX_MESSAGES_PER_SECOND: ${SPELLS_SERVER_MAX_MESSAGES_PER_SECOND:-30}
    ports:
      - "8765:8765"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
